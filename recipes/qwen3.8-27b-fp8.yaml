# Recipe: Qwen3.8-27B-FP8
# Qwen3.8-27B official block-scaled FP8 variant (28.7 GB weights).
# Dense 27B hybrid-attention model (48 Gated DeltaNet + 16 full-attention layers),
# 262K native context, built-in MTP speculative-decoding draft head.
# Requires a vllm-node image built from recent vLLM main (>= 0.27.x nightly).

recipe_version: "1"
name: Qwen3.8-27B-FP8
description: vLLM serving Qwen/Qwen3.8-27B-FP8

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-27B-FP8

# Fits comfortably on a single DGX Spark (128 GB unified memory)
solo_only: true

# Container image to use
container: vllm-node

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}'
