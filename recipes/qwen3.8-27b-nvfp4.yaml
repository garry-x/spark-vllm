# Recipe: Qwen3.8-27B-NVFP4
# Qwen3.8-27B in NVFP4 (W4A4) quantization for Blackwell — halves weight
# memory traffic vs FP8, ~2x decode speed on DGX Spark (bandwidth-bound).
# No MTP: measured slower on GB10 (draft head competes for memory bandwidth).

recipe_version: "1"
name: Qwen3.8-27B-NVFP4
description: vLLM serving Inferact/Qwen3.8-27B-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: Inferact/Qwen3.8-27B-NVFP4

# Fits comfortably on a single DGX Spark (128 GB unified memory)
solo_only: true

# Container image to use
container: vllm-node

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

# The vLLM serve command template
command: |
  vllm serve Inferact/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":2}}'
